[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "tpweb/migrations",
  "parsl",
  "fasttarget",
  "pipeline/apps.py",
  "pipeline/config.py",
  "pipeline/run_pipeline.py",
  ".claude",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
]
ignore = [
  "E501",
  "I001",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
branch = true
omit = [
  "*/migrations/*",
  "*/__pycache__/*",
  "parsl/*",
  "fasttarget/*",
  "*/tests/*",
  "manage.py",
  "scripts/run_tests.py",
  "pipeline/apps.py",
  "pipeline/config.py",
  "pipeline/run_pipeline.py",
]

[tool.coverage.report]
# Baseline measured 2026-08-10 was 21% -- floor sits a couple points below so
# the gate is regression protection, not a moving target hit by rounding
# noise. Raise this as real coverage grows; never lower it to make CI pass.
fail_under = 19
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
