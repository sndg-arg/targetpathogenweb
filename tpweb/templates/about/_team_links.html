{% load i18n %}
{% if linkedin or orcid or conicet or scholar %}
<div class="ds-pipeline-card-links">
    {% if linkedin %}<a class="tp-chip tp-chip--link" href="{{ linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>{% endif %}
    {% if orcid %}<a class="tp-chip tp-chip--link" href="{{ orcid }}" target="_blank" rel="noopener noreferrer">ORCID</a>{% endif %}
    {% if conicet %}<a class="tp-chip tp-chip--link" href="{{ conicet }}" target="_blank" rel="noopener noreferrer">{% trans "CONICET" %}</a>{% endif %}
    {% if scholar %}<a class="tp-chip tp-chip--link" href="{{ scholar }}" target="_blank" rel="noopener noreferrer">{% trans "Scholar" %}</a>{% endif %}
</div>
{% endif %}
