{% load i18n %}
{% load custom_tags %}
<tr>
    <td class="settings-name">{{ row.obj.name }}</td>
    <td class="settings-muted">{{ row.genome_label }}</td>
    <td class="settings-col-visibility">
        <form method="post" data-no-page-loader action="{% url 'tpwebapp:settings' %}?{{ settings_return_query }}" class="settings-visibility-form">
            {% csrf_token %}
            <input type="hidden" name="action" value="set_param_visibility">
            <input type="hidden" name="param_id" value="{{ row.obj.pk }}">
            <input type="hidden" name="genome_name" value="{{ row.genome_name }}">
            <select name="visibility" class="form-control tp-ui-control" aria-label="{% blocktrans with name=row.obj.name %}Who can see {{ name }}{% endblocktrans %}">
                {% for value, label in row.choices %}
                <option value="{{ value }}" {% if value == row.visibility %}selected{% endif %}>{{ label|branded:user }}</option>
                {% endfor %}
            </select>
            <span class="settings-save-state" role="status"></span>
        </form>
    </td>
    <td class="settings-col-action">
        <form method="post" data-no-page-loader action="{% url 'tpwebapp:settings' %}?{{ settings_return_query }}" data-confirm="{% blocktrans with name=row.obj.name genome=row.genome_label %}Delete {{ name }} from {{ genome }}? Anyone you shared it with will stop seeing it too.{% endblocktrans %}">
            {% csrf_token %}
            <input type="hidden" name="action" value="delete_param">
            <input type="hidden" name="param_id" value="{{ row.obj.pk }}">
            <input type="hidden" name="genome_name" value="{{ row.genome_name }}">
            <button type="submit" class="btn tp-btn tp-btn--ghost tp-btn--sm settings-delete" title="{% trans 'Delete' %}" aria-label="{% blocktrans with name=row.obj.name genome=row.genome_label %}Delete {{ name }} from {{ genome }}{% endblocktrans %}"><span class="tp-btn-icon" aria-hidden="true">{% include "components/icons/trash.html" %}</span></button>
        </form>
    </td>
</tr>
