{% load i18n %}
{% load custom_tags %}
<tr>
    <td>
        <span class="settings-name">{{ row.obj.name }}</span>
        {% if row.obj.expression %}
        <details class="settings-expression">
            <summary title="{% trans 'Show the whole expression' %}"><code>{{ row.obj.expression }}</code><span class="sr-only">: {{ row.obj.name }}</span></summary>
        </details>
        {% endif %}
    </td>
    <td class="settings-col-visibility">
        <form method="post" action="{% url 'tpwebapp:settings' %}?{{ settings_return_query }}" class="settings-visibility-form">
            {% csrf_token %}
            <input type="hidden" name="action" value="set_formula_visibility">
            <input type="hidden" name="formula_id" value="{{ row.obj.pk }}">
            <select name="visibility" class="form-control tp-ui-control" aria-label="{% blocktrans with name=row.obj.name %}Who can see {{ name }}{% endblocktrans %}" onchange="this.form.submit()">
                {% for value, label in formula_visibility_choices %}
                <option value="{{ value }}" {% if value == row.visibility %}selected{% endif %}>{{ label|branded:user }}</option>
                {% endfor %}
            </select>
        </form>
    </td>
    <td class="settings-col-action">
        <form method="post" action="{% url 'tpwebapp:settings' %}?{{ settings_return_query }}" onsubmit="return confirm(this.dataset.confirm);" data-confirm="{% blocktrans with name=row.obj.name %}Delete the formula {{ name }}? Anyone you shared it with will stop seeing it too.{% endblocktrans %}">
            {% csrf_token %}
            <input type="hidden" name="action" value="delete_formula">
            <input type="hidden" name="formula_id" value="{{ row.obj.pk }}">
            <button type="submit" class="btn tp-btn tp-btn--ghost tp-btn--sm settings-delete" title="{% trans 'Delete' %}" aria-label="{% blocktrans with name=row.obj.name %}Delete formula {{ name }}{% endblocktrans %}"><span class="tp-btn-icon" aria-hidden="true">{% include "components/icons/trash.html" %}</span></button>
        </form>
    </td>
</tr>
